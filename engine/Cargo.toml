[workspace]
resolver = "2"
members = [
    "crates/aegis_core",
    "crates/aegis_vfs",
    "crates/aegis_md_parser",
    "crates/aegis_gd_bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity & Agent Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
rand = "0.8"
rand_pcg = "0.3"
pulldown-cmark = "0.12"
regex = "1.10"
