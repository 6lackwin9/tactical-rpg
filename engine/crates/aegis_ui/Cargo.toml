[package]
name = "aegis_ui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ground_compose"
path = "src/bin/ground_compose.rs"
test = false

[[bin]]
name = "shot_compare"
path = "src/bin/shot_compare.rs"
test = false

[dependencies]
aegis_host = { path = "../aegis_host" }
aegis_core = { path = "../aegis_core" }
aegis_layout = { path = "../aegis_layout" }
serde_json = { workspace = true }
anyhow = { workspace = true }
winit = "0.30.5"
pixels = "0.15.0"
png = "0.17.13"
fontdue = "0.9.2"
rodio = { version = "0.20.1", default-features = false, features = ["vorbis", "wav"] }
# The system clipboard for the kit's text editor (PLAYUI1-T); text only (its image support would pull the image crate).
arboard = { version = "3.7.0", default-features = false }

# DISPLAY2: the monitor's work area (GetMonitorInfoW); winit reports only the whole monitor. The version winit uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
