# Fast commit gate (same steps as check_project.ps1 -Fast -Quiet, arena split by system) plus the docs lint, on the batched develop -> main PR and on pushes to main.
# Docs-only pushes to main skip it; the release PR always runs it, since it is a required check on main.
name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GATE-SPLIT (user 2026-10-18): the arena runs as one parallel job per system, so a red job names the broken
  # system; `gate` (the required check on main) passes only when every job passed.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mkdir -p "$HOME/godot/${GODOT_VERSION}"
          install -m 0755 "/tmp/godot/${name}" "$HOME/godot/${GODOT_VERSION}/godot"

      - name: Put Godot on PATH
        run: |
          sudo ln -sf "$HOME/godot/${GODOT_VERSION}/godot" /usr/local/bin/godot
          echo "GODOT=$HOME/godot/${GODOT_VERSION}/godot" >> "$GITHUB_ENV"
          godot --version

      - name: Docs lint
        run: bash tools/fc.sh docs

      - name: Class cache, parse-all and dojo
        run: |
          godot --headless --import > /tmp/import.out 2>&1 || { tail -40 /tmp/import.out; exit 1; }
          bash tools/fc.sh parse-all
          bash tools/fc.sh dojo

  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        system: [rules, ai, combat_ui, balance, world, party_save, content, menus]
    env:
      GODOT_VERSION: 4.7.2
      SUITE_TIMEOUT: 900
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mkdir -p "$HOME/godot/${GODOT_VERSION}"
          install -m 0755 "/tmp/godot/${name}" "$HOME/godot/${GODOT_VERSION}/godot"

      - name: Put Godot on PATH
        run: |
          sudo ln -sf "$HOME/godot/${GODOT_VERSION}/godot" /usr/local/bin/godot
          echo "GODOT=$HOME/godot/${GODOT_VERSION}/godot" >> "$GITHUB_ENV"
          godot --version

      - name: Arena (${{ matrix.system }})
        run: SYSTEMS=${{ matrix.system }} bash tools/fc.sh arena

  gate:
    needs: [checks, arena]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo "checks: ${{ needs.checks.result }}, arena: ${{ needs.arena.result }}"
          [ "${{ needs.checks.result }}" = success ] && [ "${{ needs.arena.result }}" = success ]
