[workspace]
resolver = "2"
members = [
    "engine/crates/aegis_data",
    "engine/crates/aegis_rules",
    "engine/crates/aegis_battle",
    "engine/crates/aegis_world",
    "engine/crates/aegis_cli",
    "engine/crates/aegis_host",
    "engine/crates/aegis_gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity & Agent Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = "2"
thiserror = "1.0"
anyhow = "1.0"
rand = "0.8"
rand_pcg = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
