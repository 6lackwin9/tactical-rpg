[workspace]
resolver = "2"
members = [
    "engine/crates/*",
    "kits/*/crates/*",
    "games/*/crates/*",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = "2"
anyhow = "1.0"

[profile.dev]
opt-level = 1
# BUILDPROF1 (user 2026-10-30): line tables only, so backtraces keep file:line while each build cache roughly halves
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# third-party crates carry no debug info
debug = false
