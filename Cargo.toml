[workspace]
resolver = "2"
members = [
    "engine/crates/*",
    "kits/*/crates/*",
    "games/*/crates/*",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = "2"
anyhow = "1.0"

# CI-HARDEN1 (ENGINE-4): a small deny set every crate takes (`[lints] workspace = true`). unsafe_code: the one Win32
# call opts out where it stands; the clippy lints bite in `tools/fc.sh lints` (the gate), where clippy runs with only
# these and the compiler's own lints on. Compiler warnings already fail the build (`tools/fc.sh build`).
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 1
# BUILDPROF1 (user 2026-10-30): line tables only, so backtraces keep file:line while each build cache roughly halves
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# third-party crates carry no debug info
debug = false
