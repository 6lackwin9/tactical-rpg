[workspace]
resolver = "2"
members = [
    "engine/crates/*",
    "kits/*/crates/*",
    "games/*/crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity & Agent Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = "2"
thiserror = "1.0"
anyhow = "1.0"
rand = "0.8"
rand_pcg = "0.3"

[profile.dev]
opt-level = 1
# BUILDPROF1 (user 2026-10-30): line tables only, so backtraces keep file:line while each build cache roughly halves
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# third-party crates carry no debug info
debug = false
