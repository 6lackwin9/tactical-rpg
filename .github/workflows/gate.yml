# Commit gate on the Aegis engine (transition step 2, 2026-10-19), on PRs into main and on pushes to main: the docs lint,
# then every crate and target built (a compiler warning fails, CI1) and every test run (the same steps as tools/fc.sh gate
# and check_project.ps1; no Godot step since CLN-42). Docs-only pushes to main skip it; `gate` is the required check on main.
name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable   # rust-toolchain.toml pins the Windows (gnullvm) toolchain of the desktop
      CARGO_TARGET_DIR: ${{ github.workspace }}/target   # .cargo/config.toml points at a Windows folder
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - name: Docs lint
        run: bash tools/fc.sh docs

      - name: System libraries (ALSA, for the audio crate on Linux)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libasound2-dev pkg-config

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Pillow for the tool tests
        run: python3 -m pip install --quiet pillow

      - name: Build and test
        run: bash tools/fc.sh gate

  gate:
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo "checks: ${{ needs.checks.result }}"
          [ "${{ needs.checks.result }}" = success ]
