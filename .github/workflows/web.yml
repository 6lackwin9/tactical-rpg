# Web (HTML5) build: exported with the "Web" preset (single-threaded, so no
# SharedArrayBuffer / cross-origin isolation headers are needed). Every PR and push to
# main builds it and uploads it as the "web-build" artifact; pushes to main also deploy
# it to GitHub Pages once the repo variable WEB_PAGES is "true" (see docs/workflow/web.md).
name: web

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mkdir -p "$HOME/godot/${GODOT_VERSION}"
          install -m 0755 "/tmp/godot/${name}" "$HOME/godot/${GODOT_VERSION}/godot"

      # Only the two single-threaded web templates (~20 MB) are kept from the ~1.3 GB .tpz.
      - name: Cache web export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-templates-${{ env.GODOT_VERSION }}

      - name: Install web export templates
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fsSL --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$dest"
          unzip -o -j -q /tmp/templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$dest"
          rm /tmp/templates.tpz
          ls -la "$dest"

      - name: Export
        run: |
          godot="$HOME/godot/${GODOT_VERSION}/godot"
          timeout 300 "$godot" --headless --import >/dev/null 2>&1 || true
          mkdir -p build/web
          if ! timeout 300 "$godot" --headless --export-release "Web" build/web/index.html > /tmp/export.log 2>&1; then
            tail -40 /tmp/export.log; exit 1
          fi
          grep -E "SCRIPT ERROR|Parse Error" /tmp/export.log && exit 1
          for f in index.html index.js index.wasm index.pck; do
            test -s "build/web/$f" || { echo "::error::export did not produce $f"; exit 1; }
          done
          ls -la build/web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WEB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WEB_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
