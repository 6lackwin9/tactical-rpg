# Web (HTML5) build: exported with the "Web" preset (single-threaded, so no
# SharedArrayBuffer / cross-origin isolation headers are needed). It builds and deploys once
# a day (19:07 UTC, skipped when main has not changed since the last deploy) and on demand
# (workflow_dispatch, always deploys). Each run uploads the "web-build" artifact, pushes to
# itch.io and to GitHub Pages when those are configured (see docs/workflow/web.md). PRs into
# main build it only when they touch the web export itself (preset or this workflow).
name: web

on:
  schedule:
    - cron: '7 19 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['export_presets.cfg', '.github/workflows/web.yml']

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The daily run skips everything when main is still at the commit of the last successful
  # scheduled or manual run; manual runs and PRs always build.
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/web.yml/runs?branch=main&status=success&per_page=30" \
            --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main unchanged since the last deploy (${last::7}); skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mkdir -p "$HOME/godot/${GODOT_VERSION}"
          install -m 0755 "/tmp/godot/${name}" "$HOME/godot/${GODOT_VERSION}/godot"

      # Only the two single-threaded web templates (~20 MB) are kept from the ~1.3 GB .tpz.
      - name: Cache web export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-templates-${{ env.GODOT_VERSION }}

      - name: Install web export templates
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fsSL --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$dest"
          unzip -o -j -q /tmp/templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$dest"
          rm /tmp/templates.tpz
          ls -la "$dest"

      - name: Export
        run: |
          godot="$HOME/godot/${GODOT_VERSION}/godot"
          timeout 300 "$godot" --headless --import >/dev/null 2>&1 || true
          mkdir -p build/web
          if ! timeout 300 "$godot" --headless --export-release "Web" build/web/index.html > /tmp/export.log 2>&1; then
            tail -40 /tmp/export.log; exit 1
          fi
          grep -E "SCRIPT ERROR|Parse Error" /tmp/export.log && exit 1
          for f in index.html index.js index.wasm index.pck; do
            test -s "build/web/$f" || { echo "::error::export did not produce $f"; exit 1; }
          done
          ls -la build/web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WEB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # Private itch.io page (restricted + password): scheduled and manual runs on main upload the build with
  # butler when the variable ITCH_TARGET (e.g. user/tactical-rpg:html5) and the secret
  # BUTLER_API_KEY are set (see docs/workflow/web.md).
  itch:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ITCH_TARGET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      - name: Upload to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          ITCH_TARGET="${ITCH_TARGET/.itch.io/}"   # accept "user.itch.io/game:html5" too
          test -n "$BUTLER_API_KEY" || { echo "::error::secret BUTLER_API_KEY is not set"; exit 1; }
          curl -fsSL --retry 3 -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q /tmp/butler.zip -d /tmp/butler && chmod +x /tmp/butler/butler
          /tmp/butler/butler push web "$ITCH_TARGET" --userversion "${GITHUB_SHA::7}"

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WEB_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
