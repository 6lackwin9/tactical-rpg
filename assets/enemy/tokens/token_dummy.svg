<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <!-- Outer wooden ring with metallic rim -->
  <circle cx="28" cy="28" r="26" fill="#2d1b0e" stroke="#ca8a04" stroke-width="3"/>
  <circle cx="28" cy="28" r="22" fill="#1e1107"/>
  <!-- Wooden post vertical pole -->
  <rect x="25" y="6" width="6" height="44" rx="2" fill="#78350f"/>
  <!-- Crossbeam horizontal arms -->
  <rect x="10" y="23" width="36" height="8" rx="2" fill="#92400e" stroke="#b45309" stroke-width="1.5"/>
  <!-- Straw target disc with concentric rings -->
  <circle cx="28" cy="27" r="14" fill="#d97706" stroke="#fef08a" stroke-width="1.5"/>
  <circle cx="28" cy="27" r="9" fill="#b45309" stroke="#fed7aa" stroke-width="1.2"/>
  <circle cx="28" cy="27" r="4" fill="#dc2626" stroke="#fca5a5" stroke-width="1"/>
  <!-- Binding ropes -->
  <line x1="24" y1="23" x2="32" y2="31" stroke="#fde68a" stroke-width="1.5"/>
  <line x1="32" y1="23" x2="24" y2="31" stroke="#fde68a" stroke-width="1.5"/>
</svg>
