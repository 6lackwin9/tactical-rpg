<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
  <defs>
    <linearGradient id="dummy_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1b10"/>
      <stop offset="100%" stop-color="#120b06"/>
    </linearGradient>
    <radialGradient id="target_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <rect width="140" height="150" rx="8" fill="url(#dummy_bg)" stroke="#ca8a04" stroke-width="2"/>
  <!-- Post base and pole -->
  <rect x="65" y="24" width="10" height="110" rx="3" fill="#78350f" stroke="#92400e" stroke-width="1.5"/>
  <rect x="42" y="124" width="56" height="12" rx="4" fill="#451a03" stroke="#78350f" stroke-width="1.5"/>
  <!-- Dummy crossbeam arms -->
  <rect x="25" y="58" width="90" height="16" rx="4" fill="#92400e" stroke="#b45309" stroke-width="2"/>
  <!-- Straw body padding with target rings -->
  <circle cx="70" cy="66" r="32" fill="url(#target_glow)"/>
  <circle cx="70" cy="66" r="30" fill="#b45309" stroke="#fef08a" stroke-width="2"/>
  <circle cx="70" cy="66" r="22" fill="#d97706" stroke="#fed7aa" stroke-width="2"/>
  <circle cx="70" cy="66" r="14" fill="#f59e0b" stroke="#fef3c7" stroke-width="1.5"/>
  <circle cx="70" cy="66" r="6" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5"/>
  <!-- Head burlap sack -->
  <circle cx="70" cy="28" r="14" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <circle cx="65" cy="26" r="2" fill="#451a03"/>
  <circle cx="75" cy="26" r="2" fill="#451a03"/>
  <!-- Cross rope stitches -->
  <line x1="60" y1="56" x2="80" y2="76" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="80" y1="56" x2="60" y2="76" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Arm straw padding wraps -->
  <rect x="22" y="54" width="14" height="24" rx="3" fill="#d97706" stroke="#fde68a" stroke-width="1"/>
  <rect x="104" y="54" width="14" height="24" rx="3" fill="#d97706" stroke="#fde68a" stroke-width="1"/>
  <!-- Label -->
  <text x="70" y="144" font-family="sans-serif" font-size="9" fill="#fde047" font-weight="bold" text-anchor="middle">TRAINING DUMMY</text>
</svg>
