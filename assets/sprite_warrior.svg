<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
  <defs>
    <linearGradient id="w_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="w_steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="w_gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="w_cape" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="140" height="150" rx="8" fill="url(#w_bg)" stroke="#3b82f6" stroke-width="2"/>

  <!-- Back Cape -->
  <path d="M 28 65 Q 16 115 24 148 L 116 148 Q 124 115 112 65 Z" fill="url(#w_cape)" opacity="0.85"/>

  <!-- Greatsword Hilt (Back Shoulder) -->
  <rect x="94" y="16" width="6" height="34" rx="2" fill="#94a3b8" transform="rotate(24 94 16)"/>
  <rect x="83" y="28" width="28" height="5" rx="2" fill="url(#w_gold)" transform="rotate(24 94 16)"/>
  <circle cx="109" cy="14" r="5" fill="url(#w_gold)"/>

  <!-- Pauldrons (Shoulders) -->
  <path d="M 20 62 Q 35 48 54 58 L 48 88 Q 28 84 20 62 Z" fill="url(#w_steel)" stroke="url(#w_gold)" stroke-width="1.5"/>
  <path d="M 120 62 Q 105 48 86 58 L 92 88 Q 112 84 120 62 Z" fill="url(#w_steel)" stroke="url(#w_gold)" stroke-width="1.5"/>

  <!-- Chestplate Torso -->
  <path d="M 46 62 Q 70 56 94 62 L 98 120 Q 70 134 42 120 Z" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <path d="M 52 68 Q 70 64 88 68 L 84 112 Q 70 122 56 112 Z" fill="url(#w_steel)"/>
  <!-- Chest Emblem -->
  <polygon points="70,74 76,86 70,98 64,86" fill="url(#w_gold)"/>
  <line x1="70" y1="72" x2="70" y2="108" stroke="#fef08a" stroke-width="1.5"/>

  <!-- Neck Gorget -->
  <path d="M 55 52 Q 70 60 85 52 L 82 64 Q 70 70 58 64 Z" fill="#334155" stroke="#94a3b8" stroke-width="1"/>

  <!-- Knight Helmet / Head -->
  <ellipse cx="70" cy="40" rx="22" ry="25" fill="url(#w_steel)" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- Helmet Crest -->
  <path d="M 67 15 Q 70 10 73 15 L 75 34 Q 70 36 65 34 Z" fill="url(#w_gold)"/>
  <!-- Visor Plate -->
  <path d="M 52 38 Q 70 42 88 38 L 86 52 Q 70 60 54 52 Z" fill="#0f172a" stroke="url(#w_gold)" stroke-width="1.5"/>
  <!-- Glowing Eye Slits -->
  <line x1="58" y1="44" x2="67" y2="44" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
  <line x1="73" y1="44" x2="82" y2="44" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
  <!-- Breath Holes -->
  <circle cx="66" cy="51" r="1" fill="#94a3b8"/>
  <circle cx="70" cy="52" r="1" fill="#94a3b8"/>
  <circle cx="74" cy="51" r="1" fill="#94a3b8"/>

  <!-- Front Arm / Gauntlet Rest -->
  <rect x="44" y="118" width="52" height="10" rx="3" fill="#1e293b" stroke="url(#w_gold)" stroke-width="1.5"/>
  <circle cx="70" cy="123" r="3.5" fill="url(#w_gold)"/>

  <!-- Class Label Badge -->
  <rect x="25" y="134" width="90" height="12" rx="4" fill="#0284c7" opacity="0.9"/>
  <text x="70" y="143" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">WARRIOR</text>
</svg>
