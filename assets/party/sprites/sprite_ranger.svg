<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
  <defs>
    <linearGradient id="r_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#061a17"/>
    </linearGradient>
    <linearGradient id="r_cloak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="r_leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="r_wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="140" height="150" rx="8" fill="url(#r_bg)" stroke="#10b981" stroke-width="2"/>

  <!-- Back Quiver & Arrows -->
  <rect x="22" y="24" width="16" height="50" rx="4" fill="url(#r_leather)" transform="rotate(-20 22 24)"/>
  <!-- Arrow Fletchings -->
  <polygon points="12,18 16,10 20,18" fill="#34d399"/>
  <polygon points="18,14 22,6 26,14" fill="#6ee7b7"/>
  <polygon points="24,18 28,10 32,18" fill="#34d399"/>

  <!-- Recurve Bow (Over Right Shoulder) -->
  <path d="M 108 12 Q 128 50 114 100" fill="none" stroke="url(#r_wood)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 108 12 L 114 100" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- Cloak Body -->
  <path d="M 32 64 Q 18 110 26 148 L 114 148 Q 122 110 108 64 Z" fill="url(#r_cloak)" opacity="0.9"/>

  <!-- Leather Tunic & Harness -->
  <path d="M 46 64 Q 70 60 94 64 L 92 120 Q 70 130 48 120 Z" fill="url(#r_leather)" stroke="#d97706" stroke-width="1.5"/>
  <!-- Cross Strap -->
  <line x1="44" y1="68" x2="92" y2="114" stroke="#451a03" stroke-width="4"/>
  <circle cx="68" cy="91" r="4" fill="#fbbf24"/>

  <!-- Scarf / Mantle -->
  <path d="M 40 54 Q 70 68 100 54 L 96 74 Q 70 82 44 74 Z" fill="#047857" stroke="#34d399" stroke-width="1"/>

  <!-- Hooded Head -->
  <path d="M 45 42 Q 70 12 95 42 Q 98 62 88 64 Q 70 68 52 64 Q 42 62 45 42 Z" fill="url(#r_cloak)" stroke="#6ee7b7" stroke-width="1.5"/>
  <!-- Hood Peak Point -->
  <polygon points="66,16 70,8 74,16" fill="#059669"/>

  <!-- Shadow under Hood Face -->
  <ellipse cx="70" cy="46" rx="16" ry="14" fill="#022c22"/>

  <!-- Glowing Emerald Eyes -->
  <ellipse cx="63" cy="45" rx="3.5" ry="2" fill="#a7f3d0"/>
  <circle cx="63" cy="45" r="1.5" fill="#047857"/>
  <ellipse cx="77" cy="45" rx="3.5" ry="2" fill="#a7f3d0"/>
  <circle cx="77" cy="45" r="1.5" fill="#047857"/>

  <!-- Lower Mask / Bandana -->
  <path d="M 58 50 Q 70 56 82 50 L 78 62 Q 70 68 62 62 Z" fill="#064e3b" stroke="#34d399" stroke-width="1"/>

  <!-- Belt & Pouch -->
  <rect x="42" y="118" width="56" height="8" rx="2" fill="#451a03"/>
  <rect x="52" y="120" width="14" height="12" rx="3" fill="url(#r_leather)" stroke="#d97706" stroke-width="1"/>
  <rect x="74" y="120" width="14" height="12" rx="3" fill="url(#r_leather)" stroke="#d97706" stroke-width="1"/>

  <!-- Class Label Badge -->
  <rect x="25" y="134" width="90" height="12" rx="4" fill="#059669" opacity="0.9"/>
  <text x="70" y="143" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">RANGER</text>
</svg>
