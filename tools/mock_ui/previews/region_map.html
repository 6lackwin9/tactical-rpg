<title>Sunk Ward Region Maps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: the map grid large on the left, its landmark, legend and anchor list in a side column; tabs per place.
     One dark look by choice: it previews dark underground maps, so their colours read true against it. */
  :root {
    --bg: #0d0e13; --panel: #15171f; --line: #2a2e3a; --fg: #e4dccb; --dim: #8d8a83;
    --gold: #f2b437; --cyan: #3fc9e0; --green: #7fcf8a; --violet: #b49cff;
    --display: 'Alegreya SC', Georgia, serif; --body: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body);
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         padding-block: 14px 28px; }
  .wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 12px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; justify-content: space-between; }
  h1 { font: 700 24px/1.1 var(--display); color: var(--gold); margin: 0; letter-spacing: .3px; }
  .sub { color: var(--dim); font-size: 13px; max-width: 78ch; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { font: 600 13px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
               border-radius: 6px; padding: 6px 11px; cursor: pointer; }
  .seg input:checked + label { border-color: var(--gold); color: var(--gold); }
  .seg input:focus-visible + label { outline: 2px solid var(--gold); outline-offset: 2px; }
  .toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); font-size: 13px; cursor: pointer; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 12px; align-items: start; }
  @media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
  .stage { border: 1px solid var(--line); border-radius: 6px; background: #07080b; overflow: auto; }
  canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
  .side { display: grid; gap: 12px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
  .card h2 { font: 700 15px var(--display); color: var(--gold); margin: 0 0 8px; letter-spacing: .3px; }
  .lm { display: block; width: 100%; max-width: 288px; margin: 0 auto; image-rendering: pixelated; }
  .note { color: var(--dim); font-size: 12.5px; margin: 8px 0 0; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 12.5px; }
  li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 7px; align-items: start; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; }
  .sw { width: 12px; height: 12px; border-radius: 2px; margin-top: 3px; border: 1px solid #0006; }
  code { font: 500 11.5px var(--mono); color: var(--fg); }
  .dim { color: var(--dim); }
  .status { font: 500 12px var(--mono); color: var(--green); }
  select { font: 600 12.5px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
  select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Sunk Ward Region Maps</h1>
      <div class="sub">Draft exploration-map layouts, one per Act 1 place, drawn top-down on the game's grid. Each follows its act-map landmark. Grounds show in their catalog colours, the way the game draws a ground before its art exists.</div>
    </div>
    <div class="seg" id="tabs"></div>
  </header>
  <div class="bar">
    <label class="toggle"><input type="checkbox" id="opt-grid" checked> Grid</label>
    <label class="toggle"><input type="checkbox" id="opt-zones"> Zones</label>
    <label class="toggle"><input type="checkbox" id="opt-anchors" checked> Anchors</label>
    <label class="toggle"><input type="checkbox" id="opt-props" checked> Prop names</label>
    <label class="toggle"><input type="checkbox" id="opt-bright" checked> Brighten grounds</label>
    <label class="toggle"><input type="checkbox" id="opt-screen" checked> Screen size</label>
    <label class="toggle" id="inside-wrap">Party is <select id="opt-inside"></select></label>
    <span style="flex:1"></span>
    <span class="status" id="status"></span>
  </div>
  <div class="main">
    <div class="stage"><canvas id="cv" width="960" height="640"></canvas></div>
    <div class="side">
      <div class="card"><h2>Landmark</h2><img class="lm" id="lm" alt="The place's act-map landmark"><p class="note" id="lm-note"></p></div>
      <div class="card"><h2>Size</h2><p class="note" id="size" style="margin:0"></p></div>
      <div class="card"><h2>Zones</h2><ul id="zones"></ul></div>
      <div class="card"><h2>Anchors</h2><ul id="anchors"></ul></div>
      <div class="card"><h2>Grounds</h2><ul id="grounds"></ul></div>
    </div>
  </div>
</div>

<script>
const DATA = /*DATA*/null;
const T = 32;   // px per tile (the game's prop scale)
const $ = id => document.getElementById(id);
let cur = 0;
const PROP_COL = {};
function hashCol(s) {
  let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const hue = [28, 38, 200, 14, 160, 270, 48, 190][h % 8];
  return `hsl(${hue} 38% 46%)`;
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(v * k)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function markerKind(text) {
  if (!text) return 'other';
  if (/^arrival|spawn/.test(text)) return 'arrive';
  if (/exit/.test(text)) return 'exit';
  if (/^(Sabina|Berek|Talia|Widow|Ivo)/.test(text)) return 'npc';
  return 'point';
}
const KCOL = { arrive: '#7fcf8a', exit: '#f2b437', npc: '#3fc9e0', point: '#e4dccb', other: '#8d8a83' };

function draw() {
  const m = DATA.maps[cur], cv = $('cv'), g = cv.getContext('2d');
  const W = m.rows[0].length, H = m.rows.length, bright = $('opt-bright').checked ? 1.9 : 1;
  cv.width = W * T; cv.height = H * T;
  g.imageSmoothingEnabled = false;
  g.font = '600 11px Inter, system-ui, sans-serif'; g.textBaseline = 'middle';
  // ground and water
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = m.ground[y][x], id = m.ground_legend[ch], col = DATA.grounds[id] || '#333333';
    g.fillStyle = shade(col, bright); g.fillRect(x * T, y * T, T, T);
    if (m.rows[y][x] === '~') {
      g.strokeStyle = 'rgba(120,150,190,.22)'; g.lineWidth = 1;
      for (let i = 0; i < 2; i++) { g.beginPath(); const yy = y * T + 10 + i * 12; g.moveTo(x * T + 5, yy); g.quadraticCurveTo(x * T + 12, yy - 3, x * T + 19, yy); g.stroke(); }
    }
  }
  // walls: a dark block with a lit top edge (light from the upper left)
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (m.rows[y][x] === '#') {
    g.fillStyle = '#16171d'; g.fillRect(x * T, y * T, T, T);
    if (y === 0 || m.rows[y - 1][x] !== '#') { g.fillStyle = '#3a3c46'; g.fillRect(x * T, y * T, T, 4); }
    if (x === 0 || m.rows[y][x - 1] !== '#') { g.fillStyle = '#2a2c34'; g.fillRect(x * T, y * T, 3, T); }
  }
  // zones
  if ($('opt-zones').checked) {
    const zc = {}; Object.entries(m.zone_legend).forEach(([c, z]) => zc[c] = z.indoor ? 'rgba(180,156,255,.25)' : z.kind === 'danger' ? 'rgba(232,90,70,.22)' : 'rgba(80,200,120,.14)');
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const c = m.zones[y][x]; if (zc[c]) { g.fillStyle = zc[c]; g.fillRect(x * T, y * T, T, T); } }
  }
  // props: ground props dashed and flat, standing props solid with a face below the top
  const groundProps = m.props.filter(p => p.layer === 'ground'), standing = m.props.filter(p => p.layer === 'sort');
  const roofs = m.props.filter(p => p.layer === 'roof'), inside = $('opt-inside').value;
  for (const p of groundProps) {
    const c = PROP_COL[p.art] ||= hashCol(p.art);
    g.save(); g.globalAlpha = .55; g.fillStyle = c; g.fillRect(p.x * T + 2, p.y * T + 2, p.w * T - 4, p.h * T - 4); g.restore();
    g.setLineDash([5, 4]); g.strokeStyle = c; g.lineWidth = 2; g.strokeRect(p.x * T + 2, p.y * T + 2, p.w * T - 4, p.h * T - 4); g.setLineDash([]);
  }
  for (const p of standing) {
    const c = PROP_COL[p.art] ||= hashCol(p.art), x = p.x * T, y = p.y * T, w = p.w * T, h = p.h * T;
    g.fillStyle = c; g.fillRect(x + 2, y + 2, w - 4, h - 4);
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x + 2, y + h * .55, w - 4, h * .45 - 2);
    g.strokeStyle = '#0b0b0f'; g.lineWidth = 2; g.strokeRect(x + 2, y + 2, w - 4, h - 4);
  }
  if ($('opt-props').checked) {
    for (const p of m.props.filter(q => q.layer !== 'roof')) {
      const cx = (p.x + p.w / 2) * T, cy = (p.y + p.h / 2) * T, label = p.art.replace(/_/g, ' ');
      const tw = g.measureText(label).width;
      g.fillStyle = 'rgba(8,9,12,.78)'; g.fillRect(cx - tw / 2 - 3, cy - 8, tw + 6, 16);
      g.fillStyle = p.layer === 'ground' ? '#c9c2b2' : '#f3ead6'; g.fillText(label, cx - tw / 2, cy + 1);
    }
  }
  if ($('opt-grid').checked) {
    g.strokeStyle = 'rgba(255,255,255,.06)'; g.lineWidth = 1;
    for (let x = 0; x <= W; x++) { g.beginPath(); g.moveTo(x * T + .5, 0); g.lineTo(x * T + .5, H * T); g.stroke(); }
    for (let y = 0; y <= H; y++) { g.beginPath(); g.moveTo(0, y * T + .5); g.lineTo(W * T, y * T + .5); g.stroke(); }
    g.fillStyle = 'rgba(242,180,55,.55)'; g.font = '500 9px JetBrains Mono, monospace';
    for (let x = 0; x < W; x += 5) g.fillText(String(x), x * T + 3, 7);
    for (let y = 5; y < H; y += 5) g.fillText(String(y), 3, y * T + 7);
    g.font = '600 11px Inter, system-ui, sans-serif';
  }
  if ($('opt-anchors').checked) {
    for (const a of m.anchors) {
      const k = markerKind(m.draft_markers[a.id]), cx = a.x * T + T / 2, cy = a.y * T + T / 2;
      g.beginPath(); g.arc(cx, cy, 8, 0, Math.PI * 2); g.fillStyle = KCOL[k]; g.fill();
      g.lineWidth = 2; g.strokeStyle = '#0b0b0f'; g.stroke();
      const tw = g.measureText(a.id).width, lx = Math.min(cx + 11, W * T - tw - 6);
      g.fillStyle = 'rgba(8,9,12,.85)'; g.fillRect(lx - 3, cy - 8, tw + 6, 16);
      g.fillStyle = KCOL[k]; g.fillText(a.id, lx, cy + 1);
    }
  }
  // roofs (REVEAL1 draft): above the characters; the room the party stands in fades to an outline
  for (const p of roofs) {
    const x = p.x * T, y = p.y * T, w = p.w * T, h = p.h * T, c = PROP_COL[p.art] ||= hashCol(p.art);
    if (p.roof_of === inside) {
      g.setLineDash([6, 4]); g.strokeStyle = c; g.lineWidth = 2; g.strokeRect(x + 1, y + 1, w - 2, h - 2); g.setLineDash([]);
      continue;
    }
    g.fillStyle = c; g.fillRect(x + 1, y + 1, w - 2, h - 2);
    g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(x + 1, y + h * .62, w - 2, h * .38 - 1);
    g.strokeStyle = '#0b0b0f'; g.lineWidth = 2; g.strokeRect(x + 1, y + 1, w - 2, h - 2);
    const label = p.art.replace(/_/g, ' ') + ' (roof)', tw = g.measureText(label).width;
    g.fillStyle = 'rgba(8,9,12,.78)'; g.fillRect(x + w / 2 - tw / 2 - 3, y + h / 2 - 8, tw + 6, 16);
    g.fillStyle = '#f3ead6'; g.fillText(label, x + w / 2 - tw / 2, y + h / 2 + 1);
  }
  // the game's screen: the map area under the HUD bar is 640 x 340 logical px and a cell is 16 px at 1x zoom, so the
  // camera shows 40 x 21.25 cells at 1x and 20 x 10.6 at 2x, centred on the party and stopped at the map's edges
  if ($('opt-screen').checked) {
    const sp = m.anchors.find(a => a.id === 'spawn');
    for (const [zoom, col] of [[1, '#f2b437'], [2, '#3fc9e0']]) {
      const vw = 40 / zoom, vh = 21.25 / zoom;
      const place = (c, v, n) => n + 2 <= v ? (n - v) / 2 : Math.max(-1, Math.min(n + 1 - v, c + .5 - v / 2));
      const fx = place(sp.x, vw, W), fy = place(sp.y, vh, H);
      g.save(); g.strokeStyle = col; g.lineWidth = 3; g.setLineDash(zoom === 1 ? [] : [10, 6]);
      g.strokeRect(fx * T, fy * T, vw * T, vh * T); g.restore();
      g.font = '700 12px Inter, system-ui, sans-serif';
      const lab = 'one screen at ' + zoom + 'x zoom', tw = g.measureText(lab).width;
      const lx = Math.max(4, fx * T + 6), ly = Math.max(10, fy * T + 12);
      g.fillStyle = 'rgba(8,9,12,.85)'; g.fillRect(lx - 3, ly - 9, tw + 6, 18); g.fillStyle = col; g.fillText(lab, lx, ly);
      g.font = '600 11px Inter, system-ui, sans-serif';
    }
  }
}

function side() {
  const m = DATA.maps[cur];
  $('lm').src = m.landmark || ''; $('lm').hidden = !m.landmark;
  const W = m.rows[0].length, H = m.rows.length;
  $('size').textContent = W + ' x ' + H + ' tiles. One screen at 1x zoom shows 40 x 21 tiles, so this map is about ' + (W / 40).toFixed(1) + ' x ' + (H / 21.25).toFixed(1) + ' screens; at 2x zoom about ' + (W / 20).toFixed(1) + ' x ' + (H / 10.6).toFixed(1) + '.';
  const zb = m.draft_zone_bindings || {};
  $('zones').innerHTML = Object.entries(m.zone_legend).map(([c, z]) => {
    const col = z.indoor ? '#b49cff' : z.kind === 'danger' ? '#e85a46' : '#7fcf8a';
    const note = z.indoor ? 'indoor: its roof fades while the party is inside' : (zb[z.id] || z.kind);
    return '<li><span class="dot" style="background:' + col + '"></span><span><code>' + c + '</code> ' + z.id + ' <span class="dim">' + z.kind + '</span><br>' + note + '</span></li>';
  }).join('');
  $('lm-note').textContent = `${m.rows[0].length} x ${m.rows.length} tiles · draft template ${m.id} · ${m.props.length} props`;
  $('anchors').innerHTML = m.anchors.map(a => {
    const t = m.draft_markers[a.id] || '', k = markerKind(t);
    return `<li><span class="dot" style="background:${KCOL[k]}"></span><span><code>${a.id}</code> <span class="dim">(${a.x}, ${a.y})</span><br>${t.replace(/</g, '&lt;')}</span></li>`;
  }).join('');
  const used = [...new Set(m.ground.join(''))];
  $('grounds').innerHTML = used.map(c => {
    const id = m.ground_legend[c], col = DATA.grounds[id] || '#333';
    return `<li><span class="sw" style="background:${shade(col, $('opt-bright').checked ? 1.9 : 1)}"></span><span><code>${c}</code> ${id} <span class="dim">${col}</span></span></li>`;
  }).join('');
  $('status').textContent = `${m.title}`;
}

function fillInside() {
  const m = DATA.maps[cur], rooms = Object.entries(m.zone_legend).filter(([, z]) => z.indoor);
  $('opt-inside').innerHTML = '<option value="">outside</option>' + rooms.map(([c, z]) => '<option value="' + c + '">inside: ' + z.id.replace(/_/g, ' ') + '</option>').join('');
  $('inside-wrap').hidden = !rooms.length;
}
function render() { draw(); side(); }
$('tabs').innerHTML = DATA.maps.map((m, i) => `<input type="radio" name="map" id="tab-${i}" value="${i}" ${i === 0 ? 'checked' : ''}><label for="tab-${i}">${m.title}</label>`).join('');
$('tabs').addEventListener('change', e => { cur = +e.target.value; fillInside(); render(); });
['opt-grid', 'opt-zones', 'opt-anchors', 'opt-props', 'opt-bright', 'opt-screen', 'opt-inside'].forEach(id => $(id).addEventListener('change', render));
fillInside(); render();
</script>
